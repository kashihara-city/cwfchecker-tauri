# タグ v* を push すると、ランナーだけでソースを検査・ビルド・テストし、来歴（attestation）を
# 付けて GitHub Release に載せる。push や pull request では動かない。
# 手動実行（workflow_dispatch）では検査・ビルド・テストだけを行い、来歴と Release は作らない。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Check, build, test, attest and publish
    # The OS generation is chosen here, not by GitHub's moving "windows-latest".
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report the toolchain
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version
          node --version

      - name: Verify the tag matches the committed versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $tagMatch = [regex]::Match(
            $env:TAG_NAME,
            '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$'
          )
          if (-not $tagMatch.Success) {
            throw "Tag '$($env:TAG_NAME)' must have the form v1.2.3 or v1.2.3-prerelease."
          }
          $version = $tagMatch.Groups["version"].Value

          $cargoToml = Get-Content -LiteralPath "src-tauri/Cargo.toml" -Raw
          $cargoMatch = [regex]::Match(
            $cargoToml,
            '(?m)^version = "(?<version>[^"]+)"$'
          )
          if (-not $cargoMatch.Success) {
            throw "Package version was not found in src-tauri/Cargo.toml."
          }
          $cargoVersion = $cargoMatch.Groups["version"].Value

          $tauriVersion = (
            Get-Content -LiteralPath "src-tauri/tauri.conf.json" -Raw |
              ConvertFrom-Json
          ).version

          $metadataLines = @(
            cargo metadata `
              --locked `
              --no-deps `
              --format-version 1 `
              --manifest-path "src-tauri/Cargo.toml"
          )
          if ($LASTEXITCODE -ne 0) {
            throw "Cargo.lock does not match the committed manifest."
          }
          $metadata = ($metadataLines -join "`n") | ConvertFrom-Json
          $lockedPackage = $metadata.packages |
            Where-Object { $_.name -eq "cwfchecker-tauri-no-npm" } |
            Select-Object -First 1
          if (-not $lockedPackage) {
            throw "Application package was not found in Cargo metadata."
          }
          $lockedVersion = $lockedPackage.version

          if (
            $cargoVersion -ne $version -or
            $tauriVersion -ne $version -or
            $lockedVersion -ne $version
          ) {
            throw (
              "Tag does not match committed versions " +
              "(tag=$version, Cargo.toml=$cargoVersion, " +
              "tauri.conf.json=$tauriVersion, Cargo.lock=$lockedVersion). " +
              "Commit the version bump before tagging."
            )
          }
          "Version $version"

      - name: Check formatting
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check and test JavaScript
        shell: pwsh
        run: ./scripts/test/javascript.ps1

      - name: Fetch the locked Rust dependencies
        shell: pwsh
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - name: Verify the seven-day dependency cooldown
        shell: pwsh
        run: |
          ./scripts/deps/resolve-cargo-cooldown.ps1 `
            -ManifestPath src-tauri/Cargo.toml `
            -MinimumAgeDays 7 `
            -TargetTriple x86_64-pc-windows-msvc

      - name: Verify the release inputs were not modified
        shell: pwsh
        run: |
          $changes = @(
            git status --porcelain -- `
              src-tauri/Cargo.toml `
              src-tauri/Cargo.lock `
              src-tauri/tauri.conf.json
          )
          if ($LASTEXITCODE -ne 0) {
            throw "git status failed while verifying release inputs."
          }
          if ($changes.Count -gt 0) {
            throw "Release inputs were modified during validation:`n$($changes -join "`n")"
          }

      - name: Install cargo-audit
        shell: pwsh
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit the locked dependencies
        shell: pwsh
        run: |
          $auditLines = @(cargo audit --file src-tauri/Cargo.lock --json)
          $auditExitCode = $LASTEXITCODE

          "## Dependency audit" >> $env:GITHUB_STEP_SUMMARY
          if ($auditExitCode -eq 0) {
            "✅ ``cargo audit`` found no known vulnerabilities." >> $env:GITHUB_STEP_SUMMARY
          } else {
            $auditLines -join "`n" | Write-Host
            "❌ ``cargo audit`` failed. See the workflow log for the JSON report." >> $env:GITHUB_STEP_SUMMARY
          }
          "" >> $env:GITHUB_STEP_SUMMARY
          "<details><summary>cargo audit JSON</summary>" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          '```json' >> $env:GITHUB_STEP_SUMMARY
          $auditLines >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          "</details>" >> $env:GITHUB_STEP_SUMMARY

          if ($auditExitCode -ne 0) {
            throw "cargo audit failed with exit code $auditExitCode."
          }

      - name: Run Clippy
        shell: pwsh
        run: |
          cargo clippy `
            --locked `
            --all-targets `
            --manifest-path src-tauri/Cargo.toml `
            -- `
            -D warnings

      - name: Run the tests
        shell: pwsh
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build the release executable
        shell: pwsh
        run: |
          # 手元のapp.ps1と同じRUSTFLAGS（静的CRT、/Brepro、パスの正規化）で組む。
          . ./scripts/dev-env.ps1
          cargo build --release --locked --features custom-protocol --manifest-path src-tauri/Cargo.toml

      - name: Package the executable
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path -LiteralPath "temp/cargo-target/release/CreateWebFlowChecker.exe").Path
          $sha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          # sha256sum 形式の添付ファイル。Release の表と同じ値を、ファイルでも配る。
          Set-Content -LiteralPath "$exe.sha256" -Value "$sha256  $(Split-Path $exe -Leaf)" -Encoding ascii -NoNewline
          "exe=$exe" >> $env:GITHUB_OUTPUT
          "exe_sha256=$sha256" >> $env:GITHUB_OUTPUT
          "$(Split-Path $exe -Leaf)  $sha256"

      - name: Attest the build provenance of the executable
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: ${{ steps.package.outputs.exe }}

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          EXE: ${{ steps.package.outputs.exe }}
          EXE_SHA256: ${{ steps.package.outputs.exe_sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:TAG_NAME
          $exeName = Split-Path $env:EXE -Leaf
          gh release view $tag --json isDraft --repo $env:REPOSITORY 2> $null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Published release assets are not replaced." }
          # YAML は共通のインデントを剥がすので、PowerShell には列 0 の here-string として届く。
          $template = @'
          GitHub Actions がこのタグのソースから組んだ実行ファイルです。
          来歴の確認: `gh attestation verify {0} --repo {1}`

          | ファイル | SHA256 |
          | --- | --- |
          | `{0}` | `{2}` |
          '@
          $notes = $template -f $exeName, $env:REPOSITORY, $env:EXE_SHA256
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          gh release create $tag $env:EXE "$env:EXE.sha256" `
            --verify-tag --title "CreateWebFlowChecker $tag" --notes-file $notesPath --repo $env:REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Could not create Release $tag." }
