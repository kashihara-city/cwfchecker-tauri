name: Release Windows application

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest, and publish
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use pinned Rust toolchain
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version

      - name: Verify tag matches committed versions
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $tagMatch = [regex]::Match(
            $env:TAG_NAME,
            '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$'
          )
          if (-not $tagMatch.Success) {
            throw "Tag '$($env:TAG_NAME)' must have the form v1.2.3 or v1.2.3-prerelease."
          }
          $version = $tagMatch.Groups["version"].Value

          $cargoToml = Get-Content -LiteralPath "src-tauri/Cargo.toml" -Raw
          $cargoMatch = [regex]::Match(
            $cargoToml,
            '(?m)^version = "(?<version>[^"]+)"$'
          )
          if (-not $cargoMatch.Success) {
            throw "Package version was not found in src-tauri/Cargo.toml."
          }
          $cargoVersion = $cargoMatch.Groups["version"].Value

          $tauriVersion = (
            Get-Content -LiteralPath "src-tauri/tauri.conf.json" -Raw |
              ConvertFrom-Json
          ).version

          $metadataLines = @(
            cargo metadata `
              --locked `
              --no-deps `
              --format-version 1 `
              --manifest-path "src-tauri/Cargo.toml"
          )
          if ($LASTEXITCODE -ne 0) {
            throw "Cargo.lock does not match the committed manifest."
          }
          $metadata = ($metadataLines -join "`n") | ConvertFrom-Json
          $lockedPackage = $metadata.packages |
            Where-Object { $_.name -eq "cwfchecker-tauri-no-npm" } |
            Select-Object -First 1
          if (-not $lockedPackage) {
            throw "Application package was not found in Cargo metadata."
          }
          $lockedVersion = $lockedPackage.version

          if (
            $cargoVersion -ne $version -or
            $tauriVersion -ne $version -or
            $lockedVersion -ne $version
          ) {
            throw (
              "Tag does not match committed versions " +
              "(tag=$version, Cargo.toml=$cargoVersion, " +
              "tauri.conf.json=$tauriVersion, Cargo.lock=$lockedVersion). " +
              "Commit the version bump before tagging."
            )
          }

      - name: Check formatting
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check and test JavaScript
        shell: pwsh
        run: ./.github/scripts/test-javascript.ps1

      - name: Populate Cargo sparse-index cache
        shell: pwsh
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - name: Verify three-day dependency cooldown
        shell: pwsh
        run: |
          ./.github/scripts/resolve-cargo-cooldown.ps1 `
            -ManifestPath src-tauri/Cargo.toml `
            -MinimumAgeDays 14

      - name: Verify release inputs were not modified
        shell: pwsh
        run: |
          $changes = @(
            git status --porcelain -- `
              src-tauri/Cargo.toml `
              src-tauri/Cargo.lock `
              src-tauri/tauri.conf.json
          )
          if ($LASTEXITCODE -ne 0) {
            throw "git status failed while verifying release inputs."
          }
          if ($changes.Count -gt 0) {
            throw "Release inputs were modified during validation:`n$($changes -join "`n")"
          }

      - name: Install cargo-audit
        shell: pwsh
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked dependencies
        shell: pwsh
        run: |
          $auditLines = @(cargo audit --file src-tauri/Cargo.lock --json)
          $auditExitCode = $LASTEXITCODE

          "## Dependency audit" >> $env:GITHUB_STEP_SUMMARY
          if ($auditExitCode -eq 0) {
            "✅ ``cargo audit`` found no known vulnerabilities." >> $env:GITHUB_STEP_SUMMARY
          } else {
            $auditLines -join "`n" | Write-Host
            "❌ ``cargo audit`` failed. See the workflow log for the JSON report." >> $env:GITHUB_STEP_SUMMARY
          }
          "" >> $env:GITHUB_STEP_SUMMARY
          "<details><summary>cargo audit JSON</summary>" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          '```json' >> $env:GITHUB_STEP_SUMMARY
          $auditLines >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          "</details>" >> $env:GITHUB_STEP_SUMMARY

          if ($auditExitCode -ne 0) {
            throw "cargo audit failed with exit code $auditExitCode."
          }

      - name: Run Clippy
        shell: pwsh
        run: |
          cargo clippy `
            --locked `
            --all-targets `
            --manifest-path src-tauri/Cargo.toml `
            -- `
            -D warnings

      - name: Run tests
        shell: pwsh
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build release executable
        shell: pwsh
        run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml

      - name: Attest release executable
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: src-tauri/target/release/CreateWebFlowChecker.exe

      - name: Prepare release executable
        id: release_asset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $executablePath = (Resolve-Path `
            -LiteralPath "src-tauri/target/release/CreateWebFlowChecker.exe"
          ).Path
          $executableHash = (
            Get-FileHash -LiteralPath $executablePath -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          "executable_path=$executablePath" >> $env:GITHUB_OUTPUT
          "executable_sha256=$executableHash" >> $env:GITHUB_OUTPUT

      - name: Complete draft and publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          EXECUTABLE_PATH: ${{ steps.release_asset.outputs.executable_path }}
          EXECUTABLE_SHA256: ${{ steps.release_asset.outputs.executable_sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:TAG_NAME

          $releaseJsonLines = @(
            gh release view `
              $tag `
              --json isDraft,body `
              --repo $env:REPOSITORY 2> $null
          )
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            $release = ($releaseJsonLines -join "`n") | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw (
                "Release $tag is already published. " +
                "Published release assets are not replaced."
              )
            }
            gh release upload `
              $tag `
              $env:EXECUTABLE_PATH `
              --clobber `
              --repo $env:REPOSITORY
          } else {
            gh release create `
              $tag `
              $env:EXECUTABLE_PATH `
              --draft `
              --verify-tag `
              --generate-notes `
              --fail-on-no-commits `
              --title "CreateWebFlowChecker $tag" `
              --repo $env:REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create or update draft Release $tag."
          }

          $bodyLines = @(
            gh release view `
              $tag `
              --json body `
              --jq ".body" `
              --repo $env:REPOSITORY
          )
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read draft Release $tag."
          }

          $body = $bodyLines -join "`n"
          $releaseFooterPattern = (
            '(?im)(?:\A|\r?\n+)\s*' +
            '(?:provenance:\s*' +
            '`gh attestation verify CreateWebFlowChecker\.exe ' +
            '--repo [^`\r\n]+`\s*\r?\n+\s*)?' +
            'sha-?256:\s*' +
            '`[0-9a-f]{64}`\s*\z'
          )
          $bodyWithoutChecksum = [regex]::Replace(
            $body,
            $releaseFooterPattern,
            ""
          ).TrimEnd()
          $attestationLine = (
            "provenance: ``gh attestation verify CreateWebFlowChecker.exe " +
            "--repo $env:REPOSITORY``"
          )
          $checksumLine = 'sha256: `' + $env:EXECUTABLE_SHA256 + '`'
          $updatedBody = "$attestationLine`n`n$checksumLine"
          if ($bodyWithoutChecksum) {
            $updatedBody = (
              "$bodyWithoutChecksum`n`n" +
              "$attestationLine`n`n" +
              $checksumLine
            )
          }

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content `
            -LiteralPath $notesPath `
            -Value $updatedBody `
            -Encoding utf8
          gh release edit `
            $tag `
            --notes-file $notesPath `
            --repo $env:REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw "Could not write the SHA-256 to draft Release $tag."
          }

          gh release edit `
            $tag `
            --draft=false `
            --repo $env:REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish draft Release $tag."
          }
